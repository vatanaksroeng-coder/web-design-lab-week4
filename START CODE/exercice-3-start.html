<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: Arial, sans-serif;
    }

    .container {
        height: 100hv;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    header {
        background: #1e90ff;
        height: 3rem;
        flex-shrink: 0;
    }

    .content {
        display: flex;
        gap: 1rem;
        flex-grow: 1;
        min-height: 0;
    }

    main {
        background: #3cb371;
        flex-grow: 1;

        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 0.5rem;

        padding: 1rem;
    }

    .item {
        background: #278959;
        width: 5rem;
        height: 3rem;
    }

    aside {
      background: #ff6052;
      width: 8rem;
      flex-shrink: 0;
    }

    footer {
      background: #4169e1;
      height: 3rem;
      flex-shrink: 0;
    }

    header,
    main,
    aside,
    footer,
    .item {
      border-radius: 0.5rem;
      box-shadow: 0 2px 4px #00000020;
      padding:1em;
    }
  </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <div class="content">
            <main>main
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </main>

            <aside>side</aside>
        </div>
        <footer>footer</footer>
    </div>
</body>
</html>
